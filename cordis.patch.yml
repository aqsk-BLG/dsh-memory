# Standalone layered memory. Installing this bundle into a profile
# activates one facade row and the durable session index its recall tool uses.
# The profile and home patch layers still apply afterwards and may override
# either row without editing the package.

- id: session-query-sqlite
  config:
    path: !!js dshHomePath('session-query.sqlite')
    openAt: first-search

- insert:
    - id: memory
      name: dsh-file-memory
